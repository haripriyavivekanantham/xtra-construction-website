<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<title>Contact – XTRA Construction</title>
<meta name="description" content="Contact – XTRA Construction, building and maintenance.">
</head>
<body data-page="contact">
<!--@header-->
<section class="page-title"><div class="container"><h1 id="project-title">Contact</h1><div class="breadcrumbs"><a href="/">Home</a> / <span id="project-crumb">Contact</span></div></div></section>
<main>
<section class="section"><div class="container contact-grid">
  <div><div class="title-block"><span class="eyebrow">Get in touch</span><h2 class="title" style="margin-bottom:30px">Request a free and fair quote</h2></div>
  <div class="info-card"><svg class="icon"><use href="#i-phone"/></svg><div><h4>Phone</h4><p><a href="tel:0018182345678">+1 (818) 23 45 678</a></p></div></div>
  <div class="info-card"><svg class="icon"><use href="#i-mail"/></svg><div><h4>Email</h4><p>hello@example.com</p></div></div>
  <div class="info-card"><svg class="icon"><use href="#i-pin"/></svg><div><h4>Address</h4><p>123 Construction Avenue, Los Angeles, CA</p></div></div>
  <div class="info-card"><svg class="icon"><use href="#i-clock"/></svg><div><h4>Opening hours</h4><p>Mon – Fri, 8:00 – 17:00</p></div></div></div>
  <form class="form-box" data-form novalidate>
    <div class="form-row">
      <label>Your Name (required)<input type="text" name="name" required maxlength="400" autocomplete="name"></label>
      <label>Your Email (required)<input type="email" name="email" required maxlength="400" autocomplete="email"></label>
    </div>
    <div class="form-row">
      <label>Subject<input type="text" name="subject" maxlength="400"></label>
      <label>Departemant<select name="department"><option>Business Departemant</option><option>Personal Departemant</option><option>Support Departemant</option><option>Others</option></select></label>
    </div>
    <label>Your Message<textarea name="message" rows="8" maxlength="2000"></textarea></label>
    <button class="btn" type="submit">Send</button>
    <p class="form-msg" role="status" hidden></p>
  </form>
</div></section>
</main>
<!--@footer-->
<script type="module" src="/src/main.js"></script>
</body>
</html>
